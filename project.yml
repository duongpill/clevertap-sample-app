name: CleverTapSample

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  CleverTapSDK:
    url: https://github.com/CleverTap/clevertap-ios-sdk
    from: 7.9.1

targets:
  CleverTapSample:
    type: application
    platform: iOS
    sources:
      - CleverTapSample
    dependencies:
      - package: CleverTapSDK
        product: CleverTapSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.clevertapsample
        PRODUCT_NAME: CleverTapSample
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: CleverTapSample/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CleverTapSample/CleverTapSample.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
